[package]
name = "conduit"
version = "0.1.0"
description = "Standalone Modrinth + SquidServers Replacement"
authors = ["Dean Alejandrino"]
edition = "2024"

[lib]
name = "conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = "2"
toml = "0.8"
regex = "1"
futures-util = "0.3"
urlencoding = "2.1"
base64 = "0.22"
flate2 = "1.0"
boringtun = { version = "0.7.1", default-features = false }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "0.11.0"
rand = "0.10.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
