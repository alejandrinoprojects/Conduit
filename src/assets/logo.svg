<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161B" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- Primary Amber Gradient -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="50%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Secondary Cyan Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Dual Ambient Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="#1E222B" stroke-width="4" />

  <!-- Dual-Tone Inner Border Accent -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="url(#cyan-grad)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#core-glow)" />

  <!-- Outer Isometric Cage (Dark Slate Structure) -->
  <polygon points="256,96 394.5,176 394.5,336 256,416 117.5,336 117.5,176" fill="#12141A" stroke="#262A34" stroke-width="10" stroke-linejoin="round" />

  <!-- Recessed Isometric Planes -->
  <path d="M256,96 L394.5,176 L256,256 L117.5,176 Z" fill="#1C2029" opacity="0.65" />
  <path d="M117.5,176 L256,256 L256,416 L117.5,336 Z" fill="#101217" opacity="0.75" />
  <path d="M394.5,176 L394.5,336 L256,416 L256,256 Z" fill="#0C0D11" opacity="0.85" />

  <!-- Cyan Network Routing Ring (Outer Telemetry Track) -->
  <polygon points="256,134 361.6,195 361.6,317 256,378 150.4,317 150.4,195" fill="none" stroke="url(#cyan-grad)" stroke-width="6" stroke-opacity="0.85" filter="url(#glow)" />

  <!-- Cyan Data Traces (Secondary Axes) -->
  <g stroke="url(#cyan-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <line x1="117.5" y1="176" x2="183" y2="214" />
    <line x1="394.5" y1="176" x2="329" y2="214" />
    <line x1="256" y1="416" x2="256" y2="340" />
  </g>

  <!-- Amber Power Traces (Primary Axes) -->
  <g stroke="url(#amber-grad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <line x1="256" y1="96" x2="256" y2="172" />
    <line x1="117.5" y1="336" x2="183" y2="298" />
    <line x1="394.5" y1="336" x2="329" y2="298" />
  </g>

  <!-- Inner Conduit Shell (Amber 'C' Frame) -->
  <path d="M 329,214 L 256,172 L 183,214 L 183,298 L 256,340 L 329,298" fill="none" stroke="url(#amber-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Heavy Corner Brackets (Minecraft Conduit Cage Motif) -->
  <g fill="none" stroke="#3B4252" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="216,119 256,96 296,119" />
    <polyline points="354.5,153 394.5,176 394.5,222" />
    <polyline points="394.5,290 394.5,336 354.5,359" />
    <polyline points="296,393 256,416 216,393" />
    <polyline points="157.5,359 117.5,336 117.5,290" />
    <polyline points="117.5,222 117.5,176 157.5,153" />
  </g>

  <!-- Cyan Corner Node Dots -->
  <g fill="#67E8F9">
    <circle cx="150.4" cy="195" r="4.5" />
    <circle cx="361.6" cy="195" r="4.5" />
    <circle cx="256" cy="378" r="4.5" />
  </g>

  <!-- Central Isometric Core Cube (Amber + Cyan Heart) -->
  <g filter="url(#glow)">
    <!-- Top Face (Cyan Energy Cap) -->
    <polygon points="256,212 294,234 256,256 218,234" fill="url(#cyan-grad)" />
    <!-- Left Face (Bright Amber) -->
    <polygon points="218,234 256,256 256,300 218,278" fill="#FF8F00" />
    <!-- Right Face (Deep Orange) -->
    <polygon points="256,256 294,234 294,278 256,300" fill="#E65100" />
  </g>

  <!-- Crisp Center Highlight -->
  <circle cx="256" cy="256" r="5" fill="#ECFEFF" />
</svg>